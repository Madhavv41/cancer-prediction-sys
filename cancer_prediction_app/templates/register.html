{% extends "base.html" %}

{% block title %}Register — CancerCare AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-scale-in">
        <div class="auth-header">
            <div class="auth-icon">&#128100;</div>
            <h1>Create Account</h1>
            <p>Register to save and track your predictions</p>
        </div>

        {% if error %}
        <div class="alert alert-error animate-shake">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
