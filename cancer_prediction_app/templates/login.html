{% extends "base.html" %}

{% block title %}Login — CancerCare AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-scale-in">
        <div class="auth-header">
            <div class="auth-icon">&#128274;</div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your prediction history</p>
        </div>

        {% if error %}
        <div class="alert alert-error animate-shake">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
